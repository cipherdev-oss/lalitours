    <script>
      // Restore accent before first paint (no flash). ocean | amber | emerald
      try {
        var saved = localStorage.getItem('lali-accent');
        if (saved === 'amber' || saved === 'emerald' || saved === 'ocean') {
          document.documentElement.dataset.accent = saved;
        } else {
          document.documentElement.dataset.accent = 'ocean';
        }
      } catch (e) {
        document.documentElement.dataset.accent = 'ocean';
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-400 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
